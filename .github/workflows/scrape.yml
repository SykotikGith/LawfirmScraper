name: Scrape law firm job postings

on:
  schedule:
    # 8am and 4pm Central Standard Time (UTC-6). NOTE: this is a fixed UTC
    # offset -- during Central Daylight Time (UTC-5, roughly mid-March to
    # early November) these actually fire at 9am/5pm Central instead of
    # 8am/4pm. Adjust to 0 14,22 * * * for the DST half of the year if that
    # drift matters.
    - cron: '0 13,21 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scrape-law-firm-postings
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: playwright install --with-deps chromium

      - name: Run scraper
        run: python -m scraper.main > scrape_output.txt 2>&1

      - name: Add scrape output to job summary
        if: always()
        run: |
          {
            echo '### scrape output'
            echo '```'
            cat scrape_output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload raw pre-filter titles
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: debug-all-titles
          path: debug_all_titles.txt
          retention-days: 14
          if-no-files-found: ignore

      - name: Commit updated seen-postings state and HTML report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/seen_postings.json data/eval_predictions.jsonl report.html index.html
          if git diff --cached --quiet; then
            echo "No change to seen-postings state or report, skipping commit."
          else
            git commit -m "Update seen-postings state and report [skip ci]"
            git push
          fi
